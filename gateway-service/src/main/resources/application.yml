server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            # === AUTH-SERVICE ===
            - id: auth-service-admin
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/admin/**
              filters:
                - StripPrefix=0

            - id: auth-service-auth
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=0

            # === COLABORADOR-SERVICE ===
            - id: colaborador-service
              uri: lb://colaborador-service
              predicates:
                - Path=/api/v1/colaborador/**
              filters:
                - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
        preferIpAddress: false
        hostname: ${HOSTNAME:gateway-service}
